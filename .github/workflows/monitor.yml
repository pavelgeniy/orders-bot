name: monitor-orders

on:
  schedule:
    - cron: "*/10 * * * *"   # каждые 10 минут (GitHub иногда запускает с задержкой)
  workflow_dispatch: {}       # кнопка "Run workflow" для ручного запуска

permissions:
  contents: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check sources and send new orders
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python bot.py
      - name: Save list of already sent orders
        run: |
          git config user.name "orders-bot"
          git config user.email "orders-bot@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || (git commit -m "update seen" -q && git push -q)
